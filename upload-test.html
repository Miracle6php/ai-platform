<!DOCTYPE html>
<html>
<head><title>Upload Test</title></head>
<body style="font-family: sans-serif; padding: 20px;">
    <h3>Test 1: Plain POST, no file</h3>
    <button onclick="testPlainPost()">Send plain POST</button>
    <pre id="result1">Not run yet.</pre>

    <h3>Test 2: POST with a small file</h3>
    <input type="file" id="fileInput" accept="video/*,image/*">
    <button onclick="testFilePost()">Send POST with file</button>
    <pre id="result2">Not run yet.</pre>

    <script>
        const ENDPOINT = window.location.origin + '/backend/face/post-test.php';

        function testPlainPost() {
            const result = document.getElementById('result1');
            result.textContent = 'Sending...';

            const xhr = new XMLHttpRequest();
            xhr.open('POST', ENDPOINT, true);
            xhr.onload = () => {
                result.textContent = 'SUCCESS (status ' + xhr.status + '):\n' + xhr.responseText;
            };
            xhr.onerror = () => {
                result.textContent = 'FAILED: xhr.onerror fired. No response received at all.';
            };
            xhr.ontimeout = () => {
                result.textContent = 'FAILED: xhr.ontimeout fired.';
            };
            xhr.timeout = 15000;
            xhr.send('test=hello');
        }

        function testFilePost() {
            const result = document.getElementById('result2');
            const fileInput = document.getElementById('fileInput');

            if (!fileInput.files[0]) {
                result.textContent = 'Pick a file first.';
                return;
            }

            result.textContent = 'Sending... file size: ' + fileInput.files[0].size + ' bytes';

            const formData = new FormData();
            formData.append('testfile', fileInput.files[0]);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', ENDPOINT, true);

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    result.textContent = 'Uploading... ' + Math.round((e.loaded / e.total) * 100) + '%';
                }
            };

            xhr.onload = () => {
                result.textContent = 'SUCCESS (status ' + xhr.status + '):\n' + xhr.responseText;
            };
            xhr.onerror = () => {
                result.textContent = 'FAILED: xhr.onerror fired. No response received at all. (file size was ' + fileInput.files[0].size + ' bytes)';
            };
            xhr.ontimeout = () => {
                result.textContent = 'FAILED: xhr.ontimeout fired.';
            };
            xhr.timeout = 60000;
            xhr.send(formData);
        }
    </script>
</body>
</html>
