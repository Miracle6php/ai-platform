<!DOCTYPE html>
<html>
<head><title>Real Endpoint Test</title></head>
<body style="font-family: sans-serif; padding: 20px;">
    <h3>Test 3: POST straight to transform.php (with credentials, matching real field names)</h3>
    <p>Video file: <input type="file" id="videoInput" accept="video/*"></p>
    <p>Reference file: <input type="file" id="refInput" accept="image/*"></p>
    <button onclick="testRealEndpoint()">Send to transform.php</button>
    <pre id="result3">Not run yet.</pre>

    <script>
        const ENDPOINT = window.location.origin + '/backend/face/transform.php';

        function testRealEndpoint() {
            const result = document.getElementById('result3');
            const videoFile = document.getElementById('videoInput').files[0];
            const refFile = document.getElementById('refInput').files[0];

            if (!videoFile || !refFile) {
                result.textContent = 'Pick both a video and a reference image first.';
                return;
            }

            result.textContent = 'Sending... video=' + videoFile.size + ' bytes, ref=' + refFile.size + ' bytes';

            const formData = new FormData();
            formData.append('video', videoFile, videoFile.name);
            formData.append('reference', refFile, refFile.name);
            formData.append('quality', 'standard');
            formData.append('duration', '3');

            const xhr = new XMLHttpRequest();
            xhr.open('POST', ENDPOINT, true);
            xhr.withCredentials = true;

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    result.textContent = 'Uploading... ' + Math.round((e.loaded / e.total) * 100) + '%';
                }
            };

            xhr.onload = () => {
                result.textContent = 'RESPONSE RECEIVED (status ' + xhr.status + '):\n' + xhr.responseText;
            };
            xhr.onerror = () => {
                result.textContent = 'FAILED: xhr.onerror fired. No response received at all.\nreadyState=' + xhr.readyState + ' status=' + xhr.status;
            };
            xhr.ontimeout = () => {
                result.textContent = 'FAILED: xhr.ontimeout fired (waited 60s with no response).';
            };
            xhr.timeout = 60000;
            xhr.send(formData);
        }
    </script>
</body>
</html>
